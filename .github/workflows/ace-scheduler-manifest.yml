name: ACE scheduler manifest

on:
  push:
    branches:
      - dev
    paths:
      - 'lua/**'
      - 'tools/ace_scheduler_manifest.py'
      - 'docs/ace_scheduler_surface_manifest.md'
      - 'tests/python/test_scheduler_manifest.py'
      - '.github/workflows/ace-scheduler-manifest.yml'
  pull_request:
    paths:
      - 'lua/**'
      - 'tools/ace_scheduler_manifest.py'
      - 'docs/ace_scheduler_surface_manifest.md'
      - 'tests/python/test_scheduler_manifest.py'
      - '.github/workflows/ace-scheduler-manifest.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify scheduler surface ledger
    runs-on: ubuntu-latest
    steps:
      - name: Check out ACE
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Run manifest regression tests
        run: python -m unittest discover -s tests/python -p test_scheduler_manifest.py -v

      - name: Verify explicit scheduler dispositions
        run: python tools/ace_scheduler_manifest.py --strict
